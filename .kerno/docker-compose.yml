services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=conduit_user"
      - "POSTGRES_PASSWORD=conduit_password"
      - "POSTGRES_DB=conduit_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U conduit_user -d conduit_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/conduit_db?user=conduit_user&password=conduit_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${DOCKERFILE_PATH}
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "6543"
    volumes:
      - ./alembic.ini:/app/alembic.ini:ro
    command:
      - bash
      - -c
      - "alembic -c alembic.ini -x ini=etc/production.ini upgrade head && gunicorn --paste etc/production.ini --bind 0.0.0.0:6543"
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z localhost 6543 || exit 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
